<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Video Downloader</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e1e1e;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      width: 350px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    h2 {
      margin-bottom: 20px;
    }
    input {
      width: 90%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      margin-bottom: 15px;
      font-size: 14px;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #ff0069;
      color: white;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }
    button:hover {
      background: #e6005c;
    }
    #status {
      margin-top: 15px;
      font-size: 14px;
      color: #00ff99;
    }
    a.download-link {
      display: block;
      margin-top: 10px;
      color: #00bfff;
      text-decoration: none;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>📥 Instagram Video Downloader</h2>
    <form id="downloadForm">
      <input type="text" id="url" placeholder="Paste Instagram URL" required>
      <button type="submit">Download</button>
    </form>
    <p id="status"></p>
    <a id="downloadLink" class="download-link" style="display:none;" target="_blank">Click here to download</a>
  </div>

  <script>
    const backendAPI = "https://YOUR_FLASK_BACKEND_URL/download"; // Replace with your Flask API URL

    document.getElementById("downloadForm").addEventListener("submit", async function(e){
      e.preventDefault();
      const url = document.getElementById("url").value;
      const status = document.getElementById("status");
      const link = document.getElementById("downloadLink");

      status.innerText = "Downloading...";
      link.style.display = "none";
      link.href = "";

      try {
        const response = await fetch(backendAPI, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: url })
        });

        const result = await response.json();
        status.innerText = result.message;

        if(result.file) {
          link.href = result.file;
          link.style.display = "block";
          link.innerText = "✅ Click here to download";
        }
      } catch(err) {
        status.innerText = "❌ Error connecting to server.";
        console.error(err);
      }
    });
  </script>
</body>
</html>
